core_value: "Adapt bigbase-canary-go to the danielvm-git central CI/CD reusable workflow template pattern (v4.1.0)"
summary: |
  Align the repository's GitHub Actions configuration with the central portfolio pattern described in
  danielvm-git/.github discussion #32 (v4.1.0). The legacy standalone test-build-release.yml and deploy.yml
  workflows will be consolidated into a single .github/workflows/ci-cd.yml calling the centralized reusable
  workflow (test-build-release-go.yml@main) with site_url set to "https://go.bigbase.click" and release_tool
  set to "big-release".
in_scope:
  - "Create .github/workflows/ci-cd.yml invoking danielvm-git/.github/.github/workflows/test-build-release-go.yml@main"
  - "Configure reusable workflow inputs: site_url='https://go.bigbase.click' and release_tool='big-release'"
  - "Decommission obsolete standalone .github/workflows/test-build-release.yml and .github/workflows/deploy.yml"
  - "Run local preflight check to ensure 100% green baseline"
out_of_scope:
  - "Modifying main.go application code"
  - "Altering big-release release binary behavior"
constraints:
  - "Must preserve big-release version tag bumping and runtime VERSION file maintenance"
  - "Must enforce zero AI attribution footers (Co-authored-by) per CONVENTIONS.md"
  - "Must follow Conventional Commits standard"
success_criteria:
  - ".github/workflows/ci-cd.yml exists and passes syntax validation"
  - "Legacy test-build-release.yml and deploy.yml files are cleanly removed"
  - "Preflight suite (go vet, golangci-lint, go test, go build) passes cleanly"
references:
  - "https://github.com/danielvm-git/.github/discussions/32"
