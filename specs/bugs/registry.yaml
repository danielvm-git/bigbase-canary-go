  - id: BUG-2026-07-30T130000
    title: Handler missing Content-Type header
    scope: handler
    severity: medium
    priority: p2
    status: fixed
    reported: 2026-07-30T13:00:00Z
    github_issue: null
    what_happened: Handler writes HTML response without setting Content-Type header
    what_expected: Handler should set Content-Type: text/html; charset=utf-8
    root_cause: handler() calls fmt.Fprintf with HTML but never sets response headers
    risk_level: low
    notes: bigbase platform adds Content-Type in production; only visible when running locally
    files_changed: main.go
    approach: Added w.Header().Set(Content-Type, text/html; charset=utf-8) before fmt.Fprintf
    new_tests: 1
    type_check: pass
    lint: pass
    commit_type: fix
    commit_message: "fix(handler): set Content-Type header for HTML response"
    file: specs/bugs/BUG-2026-07-30T130000.md

  - id: BUG-2026-07-30T130100
    title: Silent fallback on VERSION read failure
    scope: handler
    severity: low
    priority: p3
    status: fixed
    reported: 2026-07-30T13:01:00Z
    github_issue: null
    what_happened: If VERSION file is missing or unreadable, handler silently serves vunknown with HTTP 200
    what_expected: Should log the error prominently
    root_cause: os.ReadFile error is silently swallowed with fallback to unknown
    risk_level: low
    notes: Masks deployment failures where VERSION isnt properly updated
    files_changed: main.go
    approach: Added log.Printf for VERSION read errors in else branch
    new_tests: 0
    type_check: pass
    lint: pass
    commit_type: fix
    commit_message: "fix(handler): log VERSION read errors instead of silent fallback"
    file: specs/bugs/BUG-2026-07-30T130100.md

